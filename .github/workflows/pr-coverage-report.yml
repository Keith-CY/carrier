name: PR Coverage Report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.8

      - name: Daemon coverage
        working-directory: daemon
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out > coverage-func.txt

      - name: Gateway coverage
        working-directory: gateway
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test --coverage --coverage-reporter=lcov >/tmp/gateway-test.log

      - name: Build markdown summary
        run: |
          python3 - <<'PY'
          import re, pathlib
          # daemon total line coverage
          txt = pathlib.Path('daemon/coverage-func.txt').read_text()
          m = re.search(r'total:\s*\(statements\)\s*([0-9.]+)%', txt)
          daemon = float(m.group(1)) if m else 0.0

          # gateway line coverage from lcov
          lf = lh = 0
          for line in pathlib.Path('gateway/coverage/lcov.info').read_text().splitlines():
            if line.startswith('LF:'): lf += int(line[3:])
            elif line.startswith('LH:'): lh += int(line[3:])
          gateway = (lh / lf * 100.0) if lf else 0.0

          overall = (daemon + gateway) / 2.0
          marker = '<!-- carrier-pr-coverage-report -->'
          body = '\n'.join([
            marker,
            '### 📊 Coverage Report',
            '',
            '| Module | Line Coverage |',
            '|---|---:|',
            f'| Daemon (Go) | {daemon:.2f}% |',
            f'| Gateway (Bun) | {gateway:.2f}% |',
            '',
            f'**Average line coverage:** {overall:.2f}%'
          ])
          pathlib.Path('coverage-comment.md').write_text(body)
          PY

      - name: Create or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const marker = '<!-- carrier-pr-coverage-report -->';
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
