name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs read access to repository contents.
permissions:
  contents: read

jobs:
  classify-scope:
    name: Classify Scope
    runs-on: ubuntu-latest
    outputs:
      ci_only: ${{ steps.classify.outputs.ci_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          ci_only=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

            ci_only=true
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                .github/workflows/*|scripts/ci/*)
                  ;;
                *)
                  ci_only=false
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "ci_only=$ci_only" >> "$GITHUB_OUTPUT"
          echo "CI-only scope: $ci_only"

  action-pin-guard:
    name: Action Pinning Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI guard parser tests
        run: node --test scripts/ci/*.test.cjs

      - name: Validate third-party action pinning
        run: bash scripts/ci/check-action-pinning.sh

  daemon-tests:
    name: Daemon Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run daemon tests
        working-directory: daemon
        run: go test -race -count=1 ./...

  daemon-lint:
    name: Daemon Lint
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64
          working-directory: daemon

  gateway-check:
    name: Gateway Check
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI helper tests
        run: node scripts/kanban-project-id.test.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Gateway CI (type check + tests)
        working-directory: gateway
        run: bun run ci

  provider-parity:
    name: Provider Parity (${{ matrix.scenario }})
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: core
            pattern: "returns same result|returns same result shape|/pair success"
          - scenario: failure
            pattern: "error is consistent|usage errors|session-required|invalid code"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Run parity scenario tests
        working-directory: gateway
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity-artifacts
          bun test src/cross-provider.test.ts --test-name-pattern "${{ matrix.pattern }}" \
            2>&1 | tee "parity-artifacts/parity-${{ matrix.scenario }}.log"

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-parity-${{ matrix.scenario }}
          path: gateway/parity-artifacts/parity-${{ matrix.scenario }}.log
          if-no-files-found: error


  coverage-comment:
    name: Coverage Comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Daemon coverage
        working-directory: daemon
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out > coverage-func.txt

      - name: Gateway coverage
        working-directory: gateway
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --no-progress
          bun test --coverage --coverage-reporter=lcov

      - name: Collect base branch coverage
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git worktree add ../_base_cov "origin/${{ github.event.pull_request.base.ref }}"
          trap 'git worktree remove -f ../_base_cov || true' EXIT

          if [ -d ../_base_cov/daemon ]; then
            (cd ../_base_cov/daemon && go test ./... -coverprofile=coverage.out && go tool cover -func=coverage.out > coverage-func.txt)
          fi
          if [ -d ../_base_cov/gateway ]; then
            (cd ../_base_cov/gateway && bun install --frozen-lockfile --no-progress && bun test --coverage --coverage-reporter=lcov)
          fi

      - name: Build markdown summary
        run: |
          python3 - <<'PY2'
          import re, pathlib

          def parse_go_total(path):
            p = pathlib.Path(path)
            if not p.exists():
              return 0.0
            txt = p.read_text()
            m = re.search(r'total:\s*\(statements\)\s*([0-9.]+)%', txt)
            return float(m.group(1)) if m else 0.0

          def parse_lcov_pct(root):
            lcov_path = None
            for candidate in pathlib.Path(root).rglob('lcov.info'):
              lcov_path = candidate
              break
            lf = lh = 0
            if lcov_path and lcov_path.exists():
              for line in lcov_path.read_text().splitlines():
                if line.startswith('LF:'): lf += int(line[3:])
                elif line.startswith('LH:'): lh += int(line[3:])
            pct = (lh / lf * 100.0) if lf else 0.0
            return pct, lcov_path

          daemon = parse_go_total('daemon/coverage-func.txt')
          base_daemon = parse_go_total('../_base_cov/daemon/coverage-func.txt')

          gateway, lcov_path = parse_lcov_pct('gateway')
          base_gateway, base_lcov_path = parse_lcov_pct('../_base_cov/gateway')

          overall = (daemon + gateway) / 2.0
          base_overall = (base_daemon + base_gateway) / 2.0

          marker = '<!-- carrier-pr-coverage-report -->'
          lines = [
            marker,
            '### 📊 Coverage Report',
            '',
            '| Module | Line Coverage | Δ vs base |',
            '|---|---:|---:|',
            f'| Daemon (Go) | {daemon:.2f}% | {(daemon-base_daemon):+.2f}% |',
            f'| Gateway (Bun) | {gateway:.2f}% | {(gateway-base_gateway):+.2f}% |',
            '',
            f'**Average line coverage:** {overall:.2f}%',
            f'**Δ vs base:** {(overall-base_overall):+.2f}%',
          ]
          if not lcov_path:
            lines += ['', '_Note: gateway lcov.info not found on PR head; gateway reported as 0.00% in this run._']
          if not pathlib.Path('../_base_cov/daemon/coverage-func.txt').exists():
            lines += ['', '_Note: base branch daemon coverage file not found; base daemon treated as 0.00%._']
          if not base_lcov_path:
            lines += ['', '_Note: base branch gateway lcov.info not found; base gateway treated as 0.00%._']

          pathlib.Path('coverage-comment.md').write_text('\n'.join(lines))
          PY2

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- carrier-pr-coverage-report -->'
          pr='${{ github.event.pull_request.number }}'
          body=$(cat coverage-comment.md)
          existing_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate             | jq -r --arg m "$marker" '.[] | select(.user.type=="Bot" and (.body | contains($m))) | .id'             | head -n1)
          if [ -n "${existing_id:-}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Run end-to-end tests
        run: ./scripts/run-e2e-tests.sh
