name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs read access to repository contents.
permissions:
  contents: read

jobs:
  classify-scope:
    name: Classify Scope
    runs-on: ubuntu-latest
    outputs:
      ci_only: ${{ steps.classify.outputs.ci_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          ci_only=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

            ci_only=true
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                .github/workflows/*|scripts/ci/*)
                  ;;
                *)
                  ci_only=false
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "ci_only=$ci_only" >> "$GITHUB_OUTPUT"
          echo "CI-only scope: $ci_only"

  action-pin-guard:
    name: Action Pinning Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run CI guard parser tests
        run: node --test scripts/ci/*.test.cjs

      - name: Validate third-party action pinning
        run: bash scripts/ci/check-action-pinning.sh

  daemon-tests:
    name: Daemon Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Run daemon tests
        working-directory: daemon
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Generate coverage function summary
        working-directory: daemon
        run: go tool cover -func=coverage.out > coverage-func.txt

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: daemon-coverage
          path: |
            daemon/coverage.out
            daemon/coverage-func.txt
          retention-days: 7

  daemon-lint:
    name: Daemon Lint
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: daemon/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64
          working-directory: daemon

  gateway-check:
    name: Gateway Check
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run CI helper tests
        run: node scripts/kanban-project-id.test.js

      - name: Credential loader dedupe guard
        run: node scripts/ci/credential-loader-dedupe.cjs --root .

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: daemon/go.mod

  isolation-fixed-flow:
    name: Isolation Fixed Flow (${{ matrix.os }})
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: daemon/go.mod

      - name: Run deterministic isolation fixed-flow checks
        shell: bash
        run: bash scripts/isolation-fixed-flow-check.sh

  openclaw-provider-matrix:
    name: OpenClaw Provider Matrix (${{ matrix.provider }})
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [anthropic, openai, openai-codex, openrouter, openai-compatible]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Run managed OpenClaw provider e2e flow
        env:
          CARRIER_TEST_OPENCLAW_PROVIDER: ${{ matrix.provider }}
        run: go test ./cmd/carrier -run TestE2ECarrierBinaryAddOpenClawIsolationProviderMatrixChatAndUninstall -count=1

  openclaw-provider-live-smoke:
    name: OpenClaw Provider Live Smoke (${{ matrix.provider }})
    needs: classify-scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: live_smoke
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            enforcement: required
          - provider: openai-codex
            enforcement: required
          - provider: openrouter
            enforcement: required
          - provider: anthropic
            enforcement: soft_optional
          - provider: openai-compatible
            enforcement: soft_optional
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Resolve provider inputs
        id: resolve
        shell: bash
        env:
          LIVE_PROVIDER: ${{ matrix.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_CODEX_TOKEN: ${{ secrets.OPENAI_CODEX_TOKEN }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_MODEL: ${{ secrets.OPENAI_COMPATIBLE_MODEL }}
          CARRIER_LIVE_MODEL_OPENAI: ${{ vars.CARRIER_LIVE_MODEL_OPENAI }}
          CARRIER_LIVE_MODEL_OPENAI_CODEX: ${{ vars.CARRIER_LIVE_MODEL_OPENAI_CODEX }}
          CARRIER_LIVE_MODEL_OPENROUTER: ${{ vars.CARRIER_LIVE_MODEL_OPENROUTER }}
          CARRIER_LIVE_MODEL_ANTHROPIC: ${{ vars.CARRIER_LIVE_MODEL_ANTHROPIC }}
        run: |
          set -euo pipefail

          provider="${LIVE_PROVIDER}"
          key=""
          model=""
          base_url=""

          case "$provider" in
            openai)
              key="${OPENAI_API_KEY:-}"
              model="${CARRIER_LIVE_MODEL_OPENAI:-gpt-4o-mini}"
              ;;
            openai-codex)
              key="${OPENAI_CODEX_TOKEN:-}"
              model="${CARRIER_LIVE_MODEL_OPENAI_CODEX:-gpt-5.3-codex}"
              ;;
            openrouter)
              key="${OPENROUTER_API_KEY:-}"
              model="${CARRIER_LIVE_MODEL_OPENROUTER:-openai/gpt-4o-mini}"
              ;;
            anthropic)
              key="${ANTHROPIC_API_KEY:-}"
              model="${CARRIER_LIVE_MODEL_ANTHROPIC:-claude-3-5-haiku-latest}"
              ;;
            openai-compatible)
              key="${OPENAI_COMPATIBLE_API_KEY:-}"
              model="${OPENAI_COMPATIBLE_MODEL:-}"
              base_url="${OPENAI_COMPATIBLE_BASE_URL:-}"
              ;;
            *)
              echo "unsupported provider: $provider" >&2
              exit 1
              ;;
          esac

          if [[ -z "${key}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=missing_api_key_secret" >> "$GITHUB_OUTPUT"
            {
              echo "### Live Provider Smoke"
              echo "- provider: \`${provider}\`"
              echo "- status: skipped (missing API key secret)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$provider" == "openai-compatible" ]] && ([[ -z "${model}" ]] || [[ -z "${base_url}" ]]); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=missing_openai_compatible_base_or_model" >> "$GITHUB_OUTPUT"
            {
              echo "### Live Provider Smoke"
              echo "- provider: \`${provider}\`"
              echo "- status: skipped (missing OPENAI_COMPATIBLE_BASE_URL or OPENAI_COMPATIBLE_MODEL secret)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          printf 'CARRIER_LIVE_PROVIDER=%s\n' "$provider" >> "$GITHUB_ENV"
          printf 'CARRIER_LIVE_MODEL=%s\n' "$model" >> "$GITHUB_ENV"
          printf 'CARRIER_LIVE_BASE_URL=%s\n' "$base_url" >> "$GITHUB_ENV"
          printf 'CARRIER_LIVE_API_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Run live provider smoke
        if: steps.resolve.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if go test ./cmd/carrier -run TestLiveProviderSmoke -count=1 -v; then
            exit 0
          fi

          if [[ "${{ matrix.enforcement }}" == "required" ]]; then
            exit 1
          fi

          {
            echo "### Live Provider Smoke"
            echo "- provider: \`${{ matrix.provider }}\`"
            echo "- status: soft-failed"
            echo "- enforcement: \`${{ matrix.enforcement }}\`"
            echo "- note: provider is optional in CI; preserving signal without failing the workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit skipped summary
        if: steps.resolve.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Live Provider Smoke"
            echo "- provider: \`${{ matrix.provider }}\`"
            echo "- status: skipped"
            echo "- reason: \`${{ steps.resolve.outputs.skip_reason }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  webui-build:
    name: WebUI Build
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Build with WebUI tag
        run: go build -tags webui -o carrier ./cmd/carrier/

      - name: Build headless (default, no WebUI)
        run: go build -o carrier-headless ./cmd/carrier/

      - name: Version command smoke check
        shell: bash
        run: |
          set -euo pipefail
          out="$(./carrier --version)"
          echo "${out}"
          grep -E '^carrier ' <<<"${out}"
          grep -E '^commit: ' <<<"${out}"
          grep -E '^build date: ' <<<"${out}"

          sub_out="$(./carrier version)"
          short_out="$(./carrier -v)"
          [[ "${sub_out}" == "${out}" ]]
          [[ "${short_out}" == "${out}" ]]

      - name: Cross-compile WebUI (Windows amd64)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags webui -o carrier-windows.exe ./cmd/carrier/

      - name: Gateway tests
        working-directory: gateway
        run: go test -race -count=1 -parallel=2 -timeout=5m ./...

  coverage-gate:
    name: Coverage Gate
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Run coverage gate
        run: bash scripts/coverage-gate.sh

  coverage-comment:
    name: Coverage Comment
    # Reuse coverage artifacts from daemon-tests instead of re-running tests (#1170).
    needs:
      - classify-scope
      - daemon-tests
    if: github.event_name == 'pull_request' && needs.classify-scope.outputs.ci_only != 'true' && always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Download daemon coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: daemon-coverage
          path: daemon

      # Fallback: re-run daemon tests to generate coverage if the artifact from
      # the daemon-tests job is missing. This is expected for docs-only PRs
      # (fast, no daemon changes). Note: if someone force-skips daemon-tests
      # on a code PR, this will silently re-run the full daemon test suite.
      - name: Collect daemon coverage when artifact is unavailable
        if: hashFiles('daemon/coverage.out') == ''
        run: |
          set -euo pipefail
          cd daemon
          go test ./... -coverprofile=coverage.out

      - name: Collect head branch coverage
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage-root.out
          (cd baseagent && go test ./... -coverprofile=../coverage-baseagent.out)
          (cd gateway && go test ./... -coverprofile=../coverage-gateway.out)
          (cd shared && go test ./... -coverprofile=../coverage-shared.out)
          (cd profilesync && go test ./... -coverprofile=../coverage-profilesync.out)
          (cd codeagent && go test ./... -coverprofile=../coverage-codeagent.out)
          (cd webui && go test ./... -coverprofile=../coverage-webui.out)

      - name: Collect base branch coverage
        continue-on-error: true
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          base_ref="${{ github.event.pull_request.base.ref }}"

          # Fetching PR head by raw SHA can fail for fork/shallow topologies.
          # Base coverage only needs the base commit, so fetch base first with ref fallback.
          if ! git fetch --no-tags --depth=1 origin "${base_sha}"; then
            echo "Direct base SHA fetch failed; fallback to base ref ${base_ref}"
            git fetch --no-tags --depth=1 origin "${base_ref}"
          fi

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse FETCH_HEAD)"
          fi
          git worktree add ../_base_cov "${base_sha}"
          trap 'git worktree remove -f ../_base_cov || true' EXIT

          (cd ../_base_cov && go test ./... -coverprofile=coverage-base-root.out)
          (cd ../_base_cov/baseagent && go test ./... -coverprofile=../coverage-base-baseagent.out)
          (cd ../_base_cov/gateway && go test ./... -coverprofile=../coverage-base-gateway.out)
          (cd ../_base_cov/shared && go test ./... -coverprofile=../coverage-base-shared.out)
          (cd ../_base_cov/profilesync && go test ./... -coverprofile=../coverage-base-profilesync.out)
          (cd ../_base_cov/codeagent && go test ./... -coverprofile=../coverage-base-codeagent.out)
          (cd ../_base_cov/webui && go test ./... -coverprofile=../coverage-base-webui.out)
          (cd ../_base_cov/daemon && go test ./... -coverprofile=coverage.out)

          cp ../_base_cov/coverage-base-root.out coverage-base-root.out
          cp ../_base_cov/coverage-base-baseagent.out coverage-base-baseagent.out
          cp ../_base_cov/coverage-base-gateway.out coverage-base-gateway.out
          cp ../_base_cov/coverage-base-shared.out coverage-base-shared.out
          cp ../_base_cov/coverage-base-profilesync.out coverage-base-profilesync.out
          cp ../_base_cov/coverage-base-codeagent.out coverage-base-codeagent.out
          cp ../_base_cov/coverage-base-webui.out coverage-base-webui.out
          cp ../_base_cov/daemon/coverage.out coverage-base-daemon.out

      - name: Build markdown summary
        id: coverage_summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci/coverage-comment.cjs \
            --repo-root . \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --output coverage-comment.md \
            --request-output coverage-request-changes.txt \
            --product-delta-output coverage-product-delta.txt \
            --product-current-output coverage-product-current.txt

          echo "request_changes=$(cat coverage-request-changes.txt)" >> "$GITHUB_OUTPUT"
          echo "product_delta=$(cat coverage-product-delta.txt)" >> "$GITHUB_OUTPUT"
          echo "product_current=$(cat coverage-product-current.txt)" >> "$GITHUB_OUTPUT"

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- carrier-pr-coverage-report -->'
          pr='${{ github.event.pull_request.number }}'
          body=$(cat coverage-comment.md)

          # Fetch all comment IDs that contain our marker (paginated).
          # jq filters to comments containing the marker and extracts their IDs.
          # Using jq -r with select() directly avoids the need for printf+sed
          # to strip empty lines (#1175).
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            | jq -r --arg m "$marker" '[.[] | select(.body | contains($m)) | .id] | .[]')

          # Take the first matching comment ID (if any) to update in place.
          existing_id=$(echo "$ids" | head -n1)

          if [ -n "${existing_id:-}" ]; then
            # Update the existing coverage comment with the new body.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body" >/dev/null
            # Remove any duplicate marker comments (keep only the first).
            echo "$ids" | tail -n +2 | while read -r extra_id; do
              [ -n "$extra_id" ] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${extra_id}" >/dev/null || true
            done
          else
            # No existing comment found — create a new one.
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi

      - name: Request changes on major coverage regression
        if: steps.coverage_summary.outputs.request_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr='${{ github.event.pull_request.number }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          marker='<!-- carrier-pr-coverage-gate -->'
          delta='${{ steps.coverage_summary.outputs.product_delta }}'
          current='${{ steps.coverage_summary.outputs.product_current }}'

          existing_id=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews" --paginate \
            | jq -r --arg m "$marker" --arg sha "$head_sha" \
              '[.[] | select((.body // "") | contains($m)) | select(.commit_id == $sha) | .id] | .[0] // empty')

          if [ -n "${existing_id:-}" ]; then
            echo "Coverage gate review already exists for this commit: $existing_id"
            exit 0
          fi

          body="$(printf '%s\n%s\n\n%s\n\n%s' \
            "$marker" \
            'Coverage gate triggered.' \
            "Full product (Go modules) coverage: ${current}% (${delta}% vs base)." \
            'Policy: request changes when full product coverage drops by 3.00% or more.')"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews" \
            -f event=REQUEST_CHANGES \
            -f body="$body" >/dev/null

  e2e-webui:
    name: WebUI E2E Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: webui/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: webui/e2e
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright visual regression
        working-directory: webui/e2e
        env:
          SKIP_REAL_API: '1'
        run: bun run test:visual

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: visual-snapshots
          path: webui/e2e/tests/visual.spec.ts-snapshots/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: playwright-report
          path: webui/e2e/test-results/
          retention-days: 7

  e2e-control-plane-local:
    name: Control Plane Local-Real E2E
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.1.8

      - name: Install dependencies
        working-directory: webui/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: webui/e2e
        run: bunx playwright install --with-deps chromium

      - name: Run local-real control plane E2E
        run: bash scripts/e2e-control-plane-local.sh

      - name: Upload full-stack test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: playwright-report-fullstack
          path: webui/e2e/test-results-fullstack/
          retention-days: 7

  e2e-control-plane-live-provider:
    name: Control Plane Live-Provider E2E (${{ matrix.provider }})
    needs: classify-scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: live_smoke
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, openrouter]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Resolve control-plane live provider inputs
        id: resolve
        shell: bash
        env:
          LIVE_PROVIDER: ${{ matrix.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CARRIER_LIVE_MODEL_OPENAI: ${{ vars.CARRIER_LIVE_MODEL_OPENAI }}
          CARRIER_LIVE_MODEL_OPENROUTER: ${{ vars.CARRIER_LIVE_MODEL_OPENROUTER }}
        run: |
          set -euo pipefail
          provider="${LIVE_PROVIDER}"
          key=""
          model=""
          transcription_mode=""
          case "$provider" in
            openai)
              key="${OPENAI_API_KEY:-}"
              model="${CARRIER_LIVE_MODEL_OPENAI:-openai/gpt-4o-mini}"
              transcription_mode="hard_required"
              ;;
            openrouter)
              key="${OPENROUTER_API_KEY:-}"
              model="${CARRIER_LIVE_MODEL_OPENROUTER:-openai/gpt-4o-mini}"
              transcription_mode="soft_optional"
              ;;
            *)
              echo "unsupported live provider: $provider" >&2
              exit 1
              ;;
          esac
          if [[ -z "$key" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=missing_live_provider_secret" >> "$GITHUB_OUTPUT"
            {
              echo "### Control Plane Live-Provider E2E"
              echo "- provider: \`${provider}\`"
              echo "- transcription mode: \`${transcription_mode}\`"
              echo "- status: skipped (missing provider secret)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          printf 'CARRIER_LIVE_PROVIDER=%s\n' "$provider" >> "$GITHUB_ENV"
          printf 'CARRIER_LIVE_MODEL=%s\n' "$model" >> "$GITHUB_ENV"
          printf 'CARRIER_LIVE_API_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          if [[ -n "$transcription_mode" ]]; then
            printf 'CARRIER_LIVE_TRANSCRIPTION_MODE=%s\n' "$transcription_mode" >> "$GITHUB_ENV"
          fi

      - name: Run live-provider control plane E2E
        if: steps.resolve.outputs.enabled == 'true'
        run: bash scripts/e2e-control-plane-live-provider.sh

      - name: Emit skipped summary
        if: steps.resolve.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Control Plane Live-Provider E2E"
            echo "- provider: \`${{ matrix.provider }}\`"
            echo "- status: skipped"
            echo "- reason: \`${{ steps.resolve.outputs.skip_reason }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live-provider artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: control-plane-live-provider-artifacts-${{ matrix.provider }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/clp.*

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Run end-to-end tests
        env:
          CI_E2E_BACKEND: auto
        run: ./scripts/run-e2e-tests.sh
