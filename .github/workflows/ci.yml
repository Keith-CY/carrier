name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs read access to repository contents.
permissions:
  contents: read

jobs:
  classify-scope:
    name: Classify Scope
    runs-on: ubuntu-latest
    outputs:
      ci_only: ${{ steps.classify.outputs.ci_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          ci_only=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

            ci_only=true
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                .github/workflows/*|scripts/ci/*)
                  ;;
                *)
                  ci_only=false
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "ci_only=$ci_only" >> "$GITHUB_OUTPUT"
          echo "CI-only scope: $ci_only"

  action-pin-guard:
    name: Action Pinning Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI guard parser tests
        run: node --test scripts/ci/*.test.cjs

      - name: Validate third-party action pinning
        run: bash scripts/ci/check-action-pinning.sh

  daemon-tests:
    name: Daemon Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run daemon tests
        working-directory: daemon
        run: go test -race -count=1 ./...

  daemon-lint:
    name: Daemon Lint
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64
          working-directory: daemon

  gateway-check:
    name: Gateway Check
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI helper tests
        run: node scripts/kanban-project-id.test.js

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

  webui-build:
    name: WebUI Build
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Build with WebUI tag
        run: go build -tags webui -o carrier ./cmd/carrier/

      - name: Build headless (default, no WebUI)
        run: go build -o carrier-headless ./cmd/carrier/

      - name: Cross-compile WebUI (Windows amd64)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags webui -o carrier-windows.exe ./cmd/carrier/

      - name: Gateway tests
        working-directory: daemon
        run: go test -race -count=1 ./internal/gateway/...

  coverage-comment:
    name: Coverage Comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Daemon coverage
        working-directory: daemon
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage.out 2>&1 | tee test-output.txt || true
          go tool cover -func=coverage.out > coverage-func.txt

      - name: Collect base branch coverage
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git worktree add ../_base_cov "origin/${{ github.event.pull_request.base.ref }}"
          trap 'git worktree remove -f ../_base_cov || true' EXIT

          if [ -d ../_base_cov/daemon ]; then
            (cd ../_base_cov/daemon && go test ./... -coverprofile=coverage.out 2>&1 | tee test-output.txt || true && go tool cover -func=coverage.out > coverage-func.txt)
          fi

      - name: Build markdown summary
        run: |
          python3 - <<'PY2'
          import re, pathlib

          def parse_go_total(path):
            p = pathlib.Path(path)
            if not p.exists():
              return 0.0
            txt = p.read_text()
            m = re.search(r'total:\s*\(statements\)\s*([0-9.]+)%', txt)
            return float(m.group(1)) if m else 0.0

          def parse_pkg_coverage(test_output_path, prefix=''):
            """Parse per-package coverage from go test output."""
            p = pathlib.Path(test_output_path)
            if not p.exists():
              return {}
            pkgs = {}
            for line in p.read_text().splitlines():
              # ok  carrier/daemon/cmd/agentd 1.2s coverage: 79.5% of statements
              m = re.match(r'^(?:ok|FAIL)\s+(\S+)\s+\S+(?:\s+coverage:\s*([0-9.]+)%)?', line)
              if m:
                pkg = m.group(1)
                cov = float(m.group(2)) if m.group(2) else 0.0
                # strip common prefix to get short name
                if prefix and pkg.startswith(prefix):
                  pkg = pkg[len(prefix):]
                pkgs[pkg] = cov
            return pkgs

          # Determine module prefix from go.mod
          go_mod = pathlib.Path('daemon/go.mod').read_text()
          mod_match = re.search(r'^module\s+(\S+)', go_mod, re.MULTILINE)
          mod_prefix = (mod_match.group(1) + '/') if mod_match else ''

          head_pkgs = parse_pkg_coverage('daemon/test-output.txt', mod_prefix)
          base_pkgs = parse_pkg_coverage('../_base_cov/daemon/test-output.txt', mod_prefix)

          total = parse_go_total('daemon/coverage-func.txt')
          base_total = parse_go_total('../_base_cov/daemon/coverage-func.txt')

          all_pkg_names = sorted(set(list(head_pkgs.keys()) + list(base_pkgs.keys())))

          marker = '<!-- carrier-pr-coverage-report -->'
          lines = [
            marker,
            '### 📊 Coverage Report',
            '',
            '| Package | Coverage | Base | Δ |',
            '|---|---:|---:|---:|',
          ]

          low_pkgs = []
          for pkg in all_pkg_names:
            cov = head_pkgs.get(pkg)
            base = base_pkgs.get(pkg)
            if cov is None:
              cov_str = 'N/A'
            else:
              cov_str = f'{cov:.1f}%'
            if base is None:
              base_str = 'N/A'
            else:
              base_str = f'{base:.1f}%'
            if cov is not None and base is not None:
              delta = cov - base
              warn = ' ⚠️' if delta < -5 else ''
              delta_str = f'{delta:+.1f}%{warn}'
            elif cov is not None:
              delta_str = 'new'
            else:
              delta_str = 'removed'
            lines.append(f'| {pkg} | {cov_str} | {base_str} | {delta_str} |')
            if cov is not None and cov < 50.0:
              low_pkgs.append(f'{pkg} ({cov:.1f}%)')

          # Total row
          delta_total = total - base_total
          lines.append(f'| **Total** | **{total:.1f}%** | **{base_total:.1f}%** | **{delta_total:+.1f}%** |')

          if low_pkgs:
            lines += ['', f'⚠️ Packages below 50%: {", ".join(low_pkgs)}']

          if not pathlib.Path('../_base_cov/daemon/test-output.txt').exists():
            lines += ['', '_Note: base branch coverage not found; base treated as 0%._']

          pathlib.Path('coverage-comment.md').write_text('\n'.join(lines))
          PY2

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- carrier-pr-coverage-report -->'
          pr='${{ github.event.pull_request.number }}'
          body=$(cat coverage-comment.md)
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            | jq -r --arg m "$marker" '.[] | select(.body | contains($m)) | .id')
          existing_id=$(printf '%s\n' "$ids" | sed '/^$/d' | head -n1)
          if [ -n "${existing_id:-}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body" >/dev/null
            # clean up accidental duplicates, keep only the first marker comment
            printf '%s\n' "$ids" | sed '/^$/d' | tail -n +2 | while read -r extra_id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${extra_id}" >/dev/null || true
            done
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi

  e2e-webui:
    name: WebUI E2E Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: webui/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: webui/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: webui/e2e
        env:
          SKIP_REAL_API: '1'
        run: npx playwright test --update-snapshots

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: webui/e2e/tests/visual.spec.ts-snapshots/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webui/e2e/test-results/
          retention-days: 7

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run end-to-end tests
        run: ./scripts/run-e2e-tests.sh
