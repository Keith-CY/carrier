name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs read access to repository contents.
permissions:
  contents: read

jobs:
  daemon-tests:
    name: Daemon Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run daemon tests
        working-directory: daemon
        run: go test -race -count=1 ./...

  daemon-lint:
    name: Daemon Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64
          working-directory: daemon
  gateway-check:
    name: Gateway Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI helper tests
        run: node scripts/kanban-project-id.test.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Gateway CI (type check + tests)
        working-directory: gateway
        run: bun run ci

  provider-parity:
    name: Provider Parity (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: core
            pattern: "returns same result|returns same result shape|/pair success"
          - scenario: failure
            pattern: "error is consistent|usage errors|session-required|invalid code"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Run parity scenario tests
        working-directory: gateway
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity-artifacts
          bun test src/cross-provider.test.ts --test-name-pattern "${{ matrix.pattern }}" \
            2>&1 | tee "parity-artifacts/parity-${{ matrix.scenario }}.log"

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-parity-${{ matrix.scenario }}
          path: gateway/parity-artifacts/parity-${{ matrix.scenario }}.log
          if-no-files-found: error
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Run end-to-end tests
        run: ./scripts/run-e2e-tests.sh
