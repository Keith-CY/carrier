name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs read access to repository contents.
permissions:
  contents: read

jobs:
  classify-scope:
    name: Classify Scope
    runs-on: ubuntu-latest
    outputs:
      ci_only: ${{ steps.classify.outputs.ci_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          ci_only=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

            ci_only=true
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                .github/workflows/*|scripts/ci/*)
                  ;;
                *)
                  ci_only=false
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "ci_only=$ci_only" >> "$GITHUB_OUTPUT"
          echo "CI-only scope: $ci_only"

  action-pin-guard:
    name: Action Pinning Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI guard parser tests
        run: node --test scripts/ci/*.test.cjs

      - name: Validate third-party action pinning
        run: bash scripts/ci/check-action-pinning.sh

  daemon-tests:
    name: Daemon Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run daemon tests
        working-directory: daemon
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Generate coverage function summary
        working-directory: daemon
        run: go tool cover -func=coverage.out > coverage-func.txt

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-coverage
          path: |
            daemon/coverage.out
            daemon/coverage-func.txt
          retention-days: 7

  daemon-lint:
    name: Daemon Lint
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64
          working-directory: daemon

  gateway-check:
    name: Gateway Check
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI helper tests
        run: node scripts/kanban-project-id.test.js

      - name: Credential loader dedupe guard
        run: node scripts/ci/credential-loader-dedupe.cjs --root .

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

  webui-build:
    name: WebUI Build
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Build with WebUI tag
        run: go build -tags webui -o carrier ./cmd/carrier/

      - name: Build headless (default, no WebUI)
        run: go build -o carrier-headless ./cmd/carrier/

      - name: Version command smoke check
        shell: bash
        run: |
          set -euo pipefail
          out="$(./carrier --version)"
          echo "${out}"
          grep -E '^carrier ' <<<"${out}"
          grep -E '^commit: ' <<<"${out}"
          grep -E '^build date: ' <<<"${out}"

          sub_out="$(./carrier version)"
          short_out="$(./carrier -v)"
          [[ "${sub_out}" == "${out}" ]]
          [[ "${short_out}" == "${out}" ]]

      - name: Cross-compile WebUI (Windows amd64)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags webui -o carrier-windows.exe ./cmd/carrier/

      - name: Gateway tests
        working-directory: gateway
        run: go test -race -count=1 ./...

  coverage-gate:
    name: Coverage Gate
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Run coverage gate
        run: bash scripts/coverage-gate.sh

  coverage-comment:
    name: Coverage Comment
    # Reuse coverage artifacts from daemon-tests instead of re-running tests (#1170).
    needs: daemon-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Download daemon coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daemon-coverage
          path: daemon

      - name: Collect head branch coverage
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage-root.out
          (cd webui && go test ./... -coverprofile=coverage-webui.out)

      - name: Collect base branch coverage
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          base_ref="${{ github.event.pull_request.base.ref }}"

          # Fetching PR head by raw SHA can fail for fork/shallow topologies.
          # Base coverage only needs the base commit, so fetch base first with ref fallback.
          if ! git fetch --no-tags --depth=1 origin "${base_sha}"; then
            echo "Direct base SHA fetch failed; fallback to base ref ${base_ref}"
            git fetch --no-tags --depth=1 origin "${base_ref}"
          fi

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse FETCH_HEAD)"
          fi
          git worktree add ../_base_cov "${base_sha}"
          trap 'git worktree remove -f ../_base_cov || true' EXIT

          (cd ../_base_cov && go test ./... -coverprofile=coverage-root.out)
          (cd ../_base_cov/webui && go test ./... -coverprofile=coverage-webui.out)
          (cd ../_base_cov/daemon && go test ./... -coverprofile=coverage.out)

          cp ../_base_cov/coverage-root.out coverage-base-root.out
          cp ../_base_cov/webui/coverage-webui.out coverage-base-webui.out
          cp ../_base_cov/daemon/coverage.out coverage-base-daemon.out

      - name: Build markdown summary
        id: coverage_summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY2'
          import os
          import pathlib
          import subprocess
          import sys

          MODULES = [
              {
                  "key": "daemon",
                  "label": "Daemon (Go)",
                  "head_profile": "daemon/coverage.out",
                  "base_profile": "coverage-base-daemon.out",
              },
              {
                  "key": "root",
                  "label": "Carrier Core (Go)",
                  "head_profile": "coverage-root.out",
                  "base_profile": "coverage-base-root.out",
              },
              {
                  "key": "webui",
                  "label": "WebUI (Go)",
                  "head_profile": "coverage-webui.out",
                  "base_profile": "coverage-base-webui.out",
              },
          ]

          def parse_coverprofile(path):
              p = pathlib.Path(path)
              if not p.exists():
                  return {"exists": False, "total": 0, "covered": 0}

              total = 0
              covered = 0
              for raw in p.read_text().splitlines():
                  line = raw.strip()
                  if not line or line.startswith("mode:"):
                      continue
                  parts = line.rsplit(" ", 2)
                  if len(parts) != 3:
                      continue
                  try:
                      stmts = int(parts[1])
                      count = int(parts[2])
                  except ValueError:
                      continue
                  total += stmts
                  if count > 0:
                      covered += stmts

              return {"exists": True, "total": total, "covered": covered}

          def pct(stats):
              if stats["total"] == 0:
                  return 0.0
              return (stats["covered"] * 100.0) / stats["total"]

          def changed_modules():
              base_sha = os.environ.get("BASE_SHA", "").strip()
              head_sha = os.environ.get("HEAD_SHA", "").strip()
              if not base_sha or not head_sha:
                  return []

              try:
                  output = subprocess.check_output(
                      ["git", "diff", "--name-only", base_sha, head_sha],
                      text=True,
                  )
              except subprocess.CalledProcessError as err:
                  print(
                      f"changed_modules: git diff failed for {base_sha}..{head_sha}: {err}",
                      file=sys.stderr,
                  )
                  return []
              files = [f.strip() for f in output.splitlines() if f.strip()]
              selected = set()

              for path in files:
                  if path.startswith("daemon/"):
                      selected.add("daemon")
                      continue
                  if path.startswith("webui/"):
                      selected.add("webui")
                      continue
                  if (
                      path.endswith(".go")
                      or path in {"go.mod", "go.sum"}
                      or path.startswith(("cmd/", "internal/", "pkg/"))
                  ):
                      selected.add("root")

              order = ["daemon", "root", "webui"]
              return [m for m in order if m in selected]

          module_data = {}
          for mod in MODULES:
              head_stats = parse_coverprofile(mod["head_profile"])
              base_stats = parse_coverprofile(mod["base_profile"])
              head_pct = pct(head_stats)
              base_pct = pct(base_stats)
              module_data[mod["key"]] = {
                  "label": mod["label"],
                  "head": head_stats,
                  "base": base_stats,
                  "head_pct": head_pct,
                  "base_pct": base_pct,
                  "delta": head_pct - base_pct,
              }

          changed = changed_modules()
          visible_modules = changed if changed else [m["key"] for m in MODULES]

          product_head_total = sum(module_data[m["key"]]["head"]["total"] for m in MODULES)
          product_head_covered = sum(module_data[m["key"]]["head"]["covered"] for m in MODULES)
          product_base_total = sum(module_data[m["key"]]["base"]["total"] for m in MODULES)
          product_base_covered = sum(module_data[m["key"]]["base"]["covered"] for m in MODULES)

          product_head_pct = (product_head_covered * 100.0 / product_head_total) if product_head_total else 0.0
          product_base_pct = (product_base_covered * 100.0 / product_base_total) if product_base_total else 0.0
          product_delta = product_head_pct - product_base_pct

          gate_triggered = product_delta <= -3.0

          marker = '<!-- carrier-pr-coverage-report -->'
          lines = [
              marker,
              '### 📊 Coverage Report',
              '',
              '#### 1) Module Coverage (PR Scope)',
              '',
              '| Module | Line Coverage | Δ vs base |',
              '|---|---:|---:|',
          ]
          for key in visible_modules:
              row = module_data[key]
              lines.append(f'| {row["label"]} | {row["head_pct"]:.2f}% | {row["delta"]:+.2f}% |')

          if not changed:
              lines.extend([
                  '',
                  '_Note: No Go module changes detected in this PR; module section shows all Go modules._',
              ])

          lines.extend([
              '',
              '#### 2) Full Product Coverage',
              '',
              '| Scope | Line Coverage | Δ vs base |',
              '|---|---:|---:|',
              f'| Full Product (Go modules) | {product_head_pct:.2f}% | {product_delta:+.2f}% |',
              '',
              '**Policy:** request changes when full product coverage drops by 3.00% or more.',
          ])

          if gate_triggered:
              lines.extend([
                  '',
                  f'**Coverage Gate:** Triggered (full product delta {product_delta:+.2f}%).',
              ])

          pathlib.Path('coverage-comment.md').write_text('\n'.join(lines))
          pathlib.Path('coverage-request-changes.txt').write_text('true' if gate_triggered else 'false')
          pathlib.Path('coverage-product-delta.txt').write_text(f'{product_delta:+.2f}')
          pathlib.Path('coverage-product-current.txt').write_text(f'{product_head_pct:.2f}')
          PY2

          echo "request_changes=$(cat coverage-request-changes.txt)" >> "$GITHUB_OUTPUT"
          echo "product_delta=$(cat coverage-product-delta.txt)" >> "$GITHUB_OUTPUT"
          echo "product_current=$(cat coverage-product-current.txt)" >> "$GITHUB_OUTPUT"

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- carrier-pr-coverage-report -->'
          pr='${{ github.event.pull_request.number }}'
          body=$(cat coverage-comment.md)

          # Fetch all comment IDs that contain our marker (paginated).
          # jq filters to comments containing the marker and extracts their IDs.
          # Using jq -r with select() directly avoids the need for printf+sed
          # to strip empty lines (#1175).
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            | jq -r --arg m "$marker" '[.[] | select(.body | contains($m)) | .id] | .[]')

          # Take the first matching comment ID (if any) to update in place.
          existing_id=$(echo "$ids" | head -n1)

          if [ -n "${existing_id:-}" ]; then
            # Update the existing coverage comment with the new body.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body" >/dev/null
            # Remove any duplicate marker comments (keep only the first).
            echo "$ids" | tail -n +2 | while read -r extra_id; do
              [ -n "$extra_id" ] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${extra_id}" >/dev/null || true
            done
          else
            # No existing comment found — create a new one.
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi

      - name: Request changes on major coverage regression
        if: steps.coverage_summary.outputs.request_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr='${{ github.event.pull_request.number }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          marker='<!-- carrier-pr-coverage-gate -->'
          delta='${{ steps.coverage_summary.outputs.product_delta }}'
          current='${{ steps.coverage_summary.outputs.product_current }}'

          existing_id=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews" --paginate \
            | jq -r --arg m "$marker" --arg sha "$head_sha" \
              '[.[] | select((.body // "") | contains($m)) | select(.commit_id == $sha) | .id] | .[0] // empty')

          if [ -n "${existing_id:-}" ]; then
            echo "Coverage gate review already exists for this commit: $existing_id"
            exit 0
          fi

          body=$(cat <<EOF
$marker
Coverage gate triggered.

Full product (Go modules) coverage: ${current}% (${delta}% vs base).

Policy: request changes when full product coverage drops by 3.00% or more.
EOF
)

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews" \
            -f event=REQUEST_CHANGES \
            -f body="$body" >/dev/null

  e2e-webui:
    name: WebUI E2E Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: webui/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: webui/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: webui/e2e
        env:
          SKIP_REAL_API: '1'
        run: npx playwright test --update-snapshots

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-snapshots
          path: webui/e2e/tests/visual.spec.ts-snapshots/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: webui/e2e/test-results/
          retention-days: 7

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run end-to-end tests
        env:
          CI_E2E_BACKEND: auto
        run: ./scripts/run-e2e-tests.sh
