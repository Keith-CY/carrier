name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs read access to repository contents.
permissions:
  contents: read

jobs:
  classify-scope:
    name: Classify Scope
    runs-on: ubuntu-latest
    outputs:
      ci_only: ${{ steps.classify.outputs.ci_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          ci_only=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

            ci_only=true
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                .github/workflows/*|scripts/ci/*)
                  ;;
                *)
                  ci_only=false
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "ci_only=$ci_only" >> "$GITHUB_OUTPUT"
          echo "CI-only scope: $ci_only"

  action-pin-guard:
    name: Action Pinning Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI guard parser tests
        run: node --test scripts/ci/*.test.cjs

      - name: Validate third-party action pinning
        run: bash scripts/ci/check-action-pinning.sh

  daemon-tests:
    name: Daemon Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run daemon tests
        working-directory: daemon
        run: go test -race -count=1 ./...

  daemon-lint:
    name: Daemon Lint
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64
          working-directory: daemon

  gateway-check:
    name: Gateway Check
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI helper tests
        run: node scripts/kanban-project-id.test.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Gateway CI (type check + tests)
        working-directory: gateway
        run: bun run ci

  provider-parity:
    name: Provider Parity (${{ matrix.scenario }})
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: core
            pattern: "returns same result|returns same result shape|/pair success"
          - scenario: failure
            pattern: "error is consistent|usage errors|session-required|invalid code"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Run parity scenario tests
        working-directory: gateway
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity-artifacts
          bun test src/cross-provider.test.ts --test-name-pattern "${{ matrix.pattern }}" \
            2>&1 | tee "parity-artifacts/parity-${{ matrix.scenario }}.log"

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-parity-${{ matrix.scenario }}
          path: gateway/parity-artifacts/parity-${{ matrix.scenario }}.log
          if-no-files-found: error

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Run end-to-end tests
        run: ./scripts/run-e2e-tests.sh
