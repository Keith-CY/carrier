name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/kanban-config.json'
      - '.github/workflows/review-nbs-followup.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs read access to repository contents.
permissions:
  contents: read

jobs:
  classify-scope:
    name: Classify Scope
    runs-on: ubuntu-latest
    outputs:
      ci_only: ${{ steps.classify.outputs.ci_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          ci_only=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

            ci_only=true
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                .github/workflows/*|scripts/ci/*)
                  ;;
                *)
                  ci_only=false
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "ci_only=$ci_only" >> "$GITHUB_OUTPUT"
          echo "CI-only scope: $ci_only"

  action-pin-guard:
    name: Action Pinning Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI guard parser tests
        run: node --test scripts/ci/*.test.cjs

      - name: Validate third-party action pinning
        run: bash scripts/ci/check-action-pinning.sh

  daemon-tests:
    name: Daemon Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run daemon tests
        working-directory: daemon
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Generate coverage function summary
        working-directory: daemon
        run: go tool cover -func=coverage.out > coverage-func.txt

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-coverage
          path: |
            daemon/coverage.out
            daemon/coverage-func.txt
          retention-days: 7

  daemon-lint:
    name: Daemon Lint
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64
          working-directory: daemon

  gateway-check:
    name: Gateway Check
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run CI helper tests
        run: node scripts/kanban-project-id.test.js

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

  webui-build:
    name: WebUI Build
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Build with WebUI tag
        run: go build -tags webui -o carrier ./cmd/carrier/

      - name: Build headless (default, no WebUI)
        run: go build -o carrier-headless ./cmd/carrier/

      - name: Cross-compile WebUI (Windows amd64)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags webui -o carrier-windows.exe ./cmd/carrier/

      - name: Gateway tests
        working-directory: daemon
        run: go test -race -count=1 ./internal/gateway/...

  coverage-comment:
    name: Coverage Comment
    # Reuse coverage artifacts from daemon-tests instead of re-running tests (#1170).
    needs: daemon-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Download daemon coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: daemon-coverage
          path: daemon

      - name: Collect base branch coverage
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git worktree add ../_base_cov "origin/${{ github.event.pull_request.base.ref }}"
          trap 'git worktree remove -f ../_base_cov || true' EXIT

          if [ -d ../_base_cov/daemon ]; then
            (cd ../_base_cov/daemon && go test ./... -coverprofile=coverage.out && go tool cover -func=coverage.out > coverage-func.txt)
          fi

      - name: Build markdown summary
        run: |
          python3 - <<'PY2'
          import re, pathlib

          def parse_go_total(path):
            """Parse the 'total' line from 'go tool cover -func' output."""
            p = pathlib.Path(path)
            if not p.exists():
              return 0.0
            txt = p.read_text()
            m = re.search(r'total:\s*\(statements\)\s*([0-9.]+)%', txt)
            return float(m.group(1)) if m else 0.0

          daemon = parse_go_total('daemon/coverage-func.txt')
          base_daemon = parse_go_total('../_base_cov/daemon/coverage-func.txt')

          marker = '<!-- carrier-pr-coverage-report -->'
          lines = [
            marker,
            '### 📊 Coverage Report',
            '',
            '| Module | Line Coverage | Δ vs base |',
            '|---|---:|---:|',
            f'| Daemon (Go) | {daemon:.2f}% | {(daemon-base_daemon):+.2f}% |',
            '',
            f'**Line coverage:** {daemon:.2f}%',
            f'**Δ vs base:** {(daemon-base_daemon):+.2f}%',
          ]
          if not pathlib.Path('../_base_cov/daemon/coverage-func.txt').exists():
            lines += ['', '_Note: base branch daemon coverage file not found; base daemon treated as 0.00%._']

          pathlib.Path('coverage-comment.md').write_text('\n'.join(lines))
          PY2

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- carrier-pr-coverage-report -->'
          pr='${{ github.event.pull_request.number }}'
          body=$(cat coverage-comment.md)

          # Fetch all comment IDs that contain our marker (paginated).
          # jq filters to comments containing the marker and extracts their IDs.
          # Using jq -r with select() directly avoids the need for printf+sed
          # to strip empty lines (#1175).
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            | jq -r --arg m "$marker" '[.[] | select(.body | contains($m)) | .id] | .[]')

          # Take the first matching comment ID (if any) to update in place.
          existing_id=$(echo "$ids" | head -n1)

          if [ -n "${existing_id:-}" ]; then
            # Update the existing coverage comment with the new body.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body" >/dev/null
            # Remove any duplicate marker comments (keep only the first).
            echo "$ids" | tail -n +2 | while read -r extra_id; do
              [ -n "$extra_id" ] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${extra_id}" >/dev/null || true
            done
          else
            # No existing comment found — create a new one.
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi

  e2e-webui:
    name: WebUI E2E Tests
    needs: classify-scope
    if: github.event_name != 'pull_request' || needs.classify-scope.outputs.ci_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: webui/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: webui/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: webui/e2e
        env:
          SKIP_REAL_API: '1'
        run: npx playwright test --update-snapshots

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: webui/e2e/tests/visual.spec.ts-snapshots/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webui/e2e/test-results/
          retention-days: 7

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Run end-to-end tests
        run: ./scripts/run-e2e-tests.sh
