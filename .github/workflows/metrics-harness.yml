name: PR Metrics Harness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: metrics-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics-harness:
    name: Metrics Harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.1.8

      - name: Commit size metrics (soft gate)
        id: commit_size
        shell: bash
        run: |
          set -euo pipefail

          max_lines=500
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          fail=0
          fail_count=0
          max_seen=0
          total=0
          details=""

          mapfile -t commits < <(git rev-list --no-merges "${base_sha}..${head_sha}")
          total=${#commits[@]}

          for commit in "${commits[@]}"; do
            subject="$(git log --format=%s -1 "${commit}")"
            short="$(git rev-parse --short "${commit}")"
            stat="$(git diff --shortstat "${commit}^..${commit}" 2>/dev/null || true)"

            adds="$(echo "${stat}" | sed -n 's/.* \([0-9][0-9]*\) insertion.*/\1/p')"
            dels="$(echo "${stat}" | sed -n 's/.* \([0-9][0-9]*\) deletion.*/\1/p')"
            adds="${adds:-0}"
            dels="${dels:-0}"
            total_lines=$((adds + dels))

            if [[ "${total_lines}" -gt "${max_seen}" ]]; then
              max_seen="${total_lines}"
            fi

            if [[ "${total_lines}" -gt "${max_lines}" ]]; then
              details+="| \`${short}\` | ${total_lines} | ≤ ${max_lines} | ❌ | ${subject} |\n"
              fail=1
              fail_count=$((fail_count + 1))
            else
              details+="| \`${short}\` | ${total_lines} | ≤ ${max_lines} | ✅ | ${subject} |\n"
            fi
          done

          passed=$((total - fail_count))
          if [[ "${total}" -eq 0 ]]; then
            details='| _(no commits)_ | 0 | ≤ 500 | ✅ | n/a |\n'
          fi

          echo "fail=${fail}" >> "$GITHUB_OUTPUT"
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"
          echo "max_seen=${max_seen}" >> "$GITHUB_OUTPUT"
          echo "max_lines=${max_lines}" >> "$GITHUB_OUTPUT"
          printf "%b" "${details}" > /tmp/metrics_commit_details.md

      - name: Build WebUI + bundle size metrics (hard gate)
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/build-webui.sh

          assets_dir="webui/static/assets"
          index_html="webui/static/index.html"
          gzip_limit_kb=350
          initial_limit_kb=180

          if [[ ! -d "${assets_dir}" ]]; then
            echo "::error::missing ${assets_dir}" >&2
            exit 1
          fi
          if [[ ! -f "${index_html}" ]]; then
            echo "::error::missing ${index_html}" >&2
            exit 1
          fi

          raw_bytes=0
          gzip_bytes=0
          while IFS= read -r -d '' js_file; do
            file_raw=$(wc -c < "${js_file}")
            file_gzip=$(gzip -c "${js_file}" | wc -c)
            raw_bytes=$((raw_bytes + file_raw))
            gzip_bytes=$((gzip_bytes + file_gzip))
          done < <(find "${assets_dir}" -maxdepth 1 -type f -name '*.js' -print0)

          initial_gzip_bytes=0
          while IFS= read -r src; do
            src_path="${src#/}"
            full_path="webui/static/${src_path}"
            if [[ -f "${full_path}" ]]; then
              initial_gzip_bytes=$((initial_gzip_bytes + $(gzip -c "${full_path}" | wc -c)))
            fi
          done < <(grep -oE 'src="/assets/[^"]+\.js"' "${index_html}" | sed 's/src="\(.*\)"/\1/')

          raw_kb=$((raw_bytes / 1024))
          gzip_kb=$((gzip_bytes / 1024))
          initial_gzip_kb=$((initial_gzip_bytes / 1024))

          hard_fail=0
          if [[ "${gzip_kb}" -gt "${gzip_limit_kb}" ]]; then
            hard_fail=1
          fi
          if [[ "${initial_gzip_kb}" -gt "${initial_limit_kb}" ]]; then
            hard_fail=1
          fi

          echo "raw_kb=${raw_kb}" >> "$GITHUB_OUTPUT"
          echo "gzip_kb=${gzip_kb}" >> "$GITHUB_OUTPUT"
          echo "initial_gzip_kb=${initial_gzip_kb}" >> "$GITHUB_OUTPUT"
          echo "gzip_limit_kb=${gzip_limit_kb}" >> "$GITHUB_OUTPUT"
          echo "initial_limit_kb=${initial_limit_kb}" >> "$GITHUB_OUTPUT"
          echo "hard_fail=${hard_fail}" >> "$GITHUB_OUTPUT"

      - name: "Code readability (hard gate: new threshold crossings; legacy oversized files reported)"
        id: readability
        shell: bash
        run: |
          set -euo pipefail

          max_lines=500
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          checked=0
          passed=0
          violations=0
          legacy_oversized=0
          details=""

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue

            case "${file}" in
              baseagent/*|cmd/*|codeagent/*|daemon/*|gateway/*|shared/*|webui/src/*|scripts/*)
                ;;
              *)
                continue
                ;;
            esac

            case "${file}" in
              *.go|*.ts|*.tsx|*.js|*.cjs|*.mjs|*.sh)
                ;;
              *)
                continue
                ;;
            esac

            [[ -f "${file}" ]] || continue

            head_lines="$(wc -l < "${file}" | tr -d ' ')"
            base_exists=0
            base_lines=0
            base_label='new'
            if git cat-file -e "${base_sha}:${file}" 2>/dev/null; then
              base_exists=1
              base_lines="$(git show "${base_sha}:${file}" | wc -l | tr -d ' ')"
              base_label="${base_lines}"
            fi
            checked=$((checked + 1))

            gate='hard'
            note='within limit'
            if [[ "${head_lines}" -le "${max_lines}" ]]; then
              status='✅'
              passed=$((passed + 1))
            elif [[ "${base_exists}" -eq 1 && "${base_lines}" -gt "${max_lines}" ]]; then
              gate='soft'
              note='legacy oversized file'
              status='⚠️'
              legacy_oversized=$((legacy_oversized + 1))
            else
              note='new or newly oversized file'
              status='❌'
              violations=$((violations + 1))
            fi

            details+="| \`${file}\` | ${base_label} | ${head_lines} | ${gate} | ${status} | ${note} |\n"
          done < <(git diff --name-only "${base_sha}" "${head_sha}")

          if [[ "${checked}" -eq 0 ]]; then
            details='| _(no changed source files)_ | — | 0 | hard | ✅ | n/a |\n'
          fi

          fail=0
          if [[ "${violations}" -gt 0 ]]; then
            fail=1
          fi

          printf "%b" "${details}" > /tmp/metrics_readability_details.md
          echo "max_lines=${max_lines}" >> "$GITHUB_OUTPUT"
          echo "checked=${checked}" >> "$GITHUB_OUTPUT"
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"
          echo "violations=${violations}" >> "$GITHUB_OUTPUT"
          echo "legacy_oversized=${legacy_oversized}" >> "$GITHUB_OUTPUT"
          echo "fail=${fail}" >> "$GITHUB_OUTPUT"

      - name: "Perf probes (soft gate: CLI timing + remote path test timing)"
        id: perf
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          build_start_ns="$(date +%s%N)"
          go build -o dist/carrier-perf ./cmd/carrier
          build_end_ns="$(date +%s%N)"
          build_ms=$(( (build_end_ns - build_start_ns) / 1000000 ))
          binary_size_bytes="$(wc -c < dist/carrier-perf | tr -d ' ')"
          binary_size_mb="$(awk -v b="${binary_size_bytes}" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"

          cmd_limit_ms=800
          cmd_runs=0
          cmd_failures=0
          cmd_details=""
          all_times=""

          cmds=(
            "--help"
            "version"
            "--version"
          )

          for cmd in "${cmds[@]}"; do
            runs_for_cmd=3
            failures=0
            times=""

            for i in 1 2 3; do
              start_ns="$(date +%s%N)"
              if ./dist/carrier-perf ${cmd} >/dev/null 2>&1; then
                :
              else
                failures=$((failures + 1))
                cmd_failures=$((cmd_failures + 1))
              fi
              end_ns="$(date +%s%N)"

              ms=$(( (end_ns - start_ns) / 1000000 ))
              times+="${ms}\n"
              all_times+="${ms}\n"
              cmd_runs=$((cmd_runs + 1))
            done

            sorted="$(printf "%b" "${times}" | sed '/^$/d' | sort -n)"
            p50="$(echo "${sorted}" | awk 'NF{a[++n]=$1} END{if(n==0){print 0}else{print a[int((n+1)/2)]}}')"
            p95="$(echo "${sorted}" | awk 'NF{a[++n]=$1} END{if(n==0){print 0}else{idx=int((n*95+99)/100); if(idx<1)idx=1; if(idx>n)idx=n; print a[idx]}}')"
            max="$(echo "${sorted}" | awk 'NF{m=$1} END{if(NR==0){print 0}else{print m}}')"

            status='✅'
            if [[ "${failures}" -gt 0 ]] || [[ "${p95}" -gt "${cmd_limit_ms}" ]]; then
              status='⚠️'
            fi

            cmd_details+="| \`carrier ${cmd}\` | ${runs_for_cmd} | ${failures} | ${p50} ms | ${p95} ms | ${max} ms | ${status} |\n"
          done

          if [[ -z "${cmd_details}" ]]; then
            cmd_details='| _(no command probes)_ | 0 | 0 | 0 ms | 0 ms | 0 ms | ℹ️ |\n'
          fi
          printf "%b" "${cmd_details}" > /tmp/metrics_perf_cmd_details.md

          all_sorted="$(printf "%b" "${all_times}" | sed '/^$/d' | sort -n)"
          overall_p50_ms="$(echo "${all_sorted}" | awk 'NF{a[++n]=$1} END{if(n==0){print 0}else{print a[int((n+1)/2)]}}')"
          overall_p95_ms="$(echo "${all_sorted}" | awk 'NF{a[++n]=$1} END{if(n==0){print 0}else{idx=int((n*95+99)/100); if(idx<1)idx=1; if(idx>n)idx=n; print a[idx]}}')"
          overall_max_ms="$(echo "${all_sorted}" | awk 'NF{m=$1} END{if(NR==0){print 0}else{print m}}')"

          remote_suite_ok=true
          gateway_suite_ok=true

          remote_start_ns="$(date +%s%N)"
          if go test ./cmd/carrier -run 'TestRunRemoteRunCommandUsesOpenClawAliasAndWritesOutput|TestRunRemoteRunCommandJSONOutputSkipsGatewayProgress' -count=1 >/tmp/metrics_perf_remote_cmd_test.log 2>&1; then
            :
          else
            remote_suite_ok=false
          fi
          remote_end_ns="$(date +%s%N)"
          remote_suite_ms=$(( (remote_end_ns - remote_start_ns) / 1000000 ))

          gateway_start_ns="$(date +%s%N)"
          if (
            cd gateway
            go test ./... -run 'TestRemoteMetricsEndpointTracksOperations|TestRemoteMetricsCollectorSnapshot' -count=1 >/tmp/metrics_perf_gateway_test.log 2>&1
          ); then
            :
          else
            gateway_suite_ok=false
          fi
          gateway_end_ns="$(date +%s%N)"
          gateway_suite_ms=$(( (gateway_end_ns - gateway_start_ns) / 1000000 ))

          # Remote SSH timing probes (localhost loopback, soft gate)
          ssh_ready=false
          ssh_cmd_limit_ms=2500
          ssh_cmd_runs=0
          ssh_cmd_failures=0
          ssh_cmd_details=""
          ssh_all_times=""
          ssh_batch_times=""
          ssh_overall_p95_ms=0
          ssh_overall_max_ms=0
          ssh_batch_p50_ms=0

          ssh_user="$(whoami)"
          ssh_port=2231
          ssh_key=/tmp/metrics_ssh_key
          ssh_known_hosts=/tmp/metrics_ssh_known_hosts

          if ! command -v sshd >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null 2>&1 || true
            sudo apt-get install -y openssh-server >/dev/null 2>&1 || true
          fi

          if command -v sshd >/dev/null 2>&1 && command -v ssh >/dev/null 2>&1; then
            mkdir -p "${HOME}/.ssh"
            chmod 700 "${HOME}/.ssh"
            if [[ ! -f "${ssh_key}" ]]; then
              ssh-keygen -t ed25519 -N "" -f "${ssh_key}" >/dev/null
            fi
            touch "${HOME}/.ssh/authorized_keys"
            if ! grep -q -F "$(cat "${ssh_key}.pub")" "${HOME}/.ssh/authorized_keys"; then
              cat "${ssh_key}.pub" >> "${HOME}/.ssh/authorized_keys"
            fi
            chmod 600 "${HOME}/.ssh/authorized_keys"

            sudo mkdir -p /var/run/sshd
            sudo bash -c "printf '%s\n' \"Port ${ssh_port}\" \"ListenAddress 127.0.0.1\" \"PasswordAuthentication no\" \"PubkeyAuthentication yes\" \"PermitRootLogin no\" \"AllowUsers ${ssh_user}\" > /etc/ssh/sshd_config.d/99-carrier-metrics.conf"

            sudo service ssh restart >/dev/null 2>&1 || sudo /usr/sbin/sshd >/dev/null 2>&1 || true

            ssh_opts=(
              -i "${ssh_key}"
              -o BatchMode=yes
              -o StrictHostKeyChecking=no
              -o UserKnownHostsFile="${ssh_known_hosts}"
              -o ConnectTimeout=5
              -p "${ssh_port}"
            )

            for _ in 1 2 3 4 5; do
              if ssh "${ssh_opts[@]}" "${ssh_user}@127.0.0.1" "echo ok" >/dev/null 2>&1; then
                ssh_ready=true
                break
              fi
              sleep 1
            done

            if [[ "${ssh_ready}" == true ]]; then
              remote_bin="${PWD}/dist/carrier-perf"
              for entry in \
                "help::${remote_bin} --help" \
                "version::${remote_bin} version" \
                "version-flag::${remote_bin} --version"; do
                label="${entry%%::*}"
                remote_cmd="${entry#*::}"

                runs_for_cmd=3
                failures=0
                times=""

                for i in 1 2 3; do
                  start_ns="$(date +%s%N)"
                  if ssh "${ssh_opts[@]}" "${ssh_user}@127.0.0.1" "${remote_cmd}" >/dev/null 2>&1; then
                    :
                  else
                    failures=$((failures + 1))
                    ssh_cmd_failures=$((ssh_cmd_failures + 1))
                  fi
                  end_ns="$(date +%s%N)"

                  ms=$(( (end_ns - start_ns) / 1000000 ))
                  times+="${ms}\n"
                  ssh_all_times+="${ms}\n"
                  ssh_cmd_runs=$((ssh_cmd_runs + 1))
                done

                sorted="$(printf "%b" "${times}" | sed '/^$/d' | sort -n)"
                p50="$(echo "${sorted}" | awk 'NF{a[++n]=$1} END{if(n==0){print 0}else{print a[int((n+1)/2)]}}')"
                p95="$(echo "${sorted}" | awk 'NF{a[++n]=$1} END{if(n==0){print 0}else{idx=int((n*95+99)/100); if(idx<1)idx=1; if(idx>n)idx=n; print a[idx]}}')"
                max="$(echo "${sorted}" | awk 'NF{m=$1} END{if(NR==0){print 0}else{print m}}')"

                status='✅'
                if [[ "${failures}" -gt 0 ]] || [[ "${p95}" -gt "${ssh_cmd_limit_ms}" ]]; then
                  status='⚠️'
                fi

                ssh_cmd_details+="| \`ssh:${label}\` | ${runs_for_cmd} | ${failures} | ${p50} ms | ${p95} ms | ${max} ms | ${status} |\n"
              done

              for i in 1 2 3; do
                start_ns="$(date +%s%N)"
                if ssh "${ssh_opts[@]}" "${ssh_user}@127.0.0.1" "${remote_bin} --help >/dev/null 2>&1; ${remote_bin} version >/dev/null 2>&1; ${remote_bin} --version >/dev/null 2>&1" >/dev/null 2>&1; then
                  :
                else
                  ssh_cmd_failures=$((ssh_cmd_failures + 1))
                fi
                end_ns="$(date +%s%N)"

                ms=$(( (end_ns - start_ns) / 1000000 ))
                ssh_batch_times+="${ms}\n"
              done

              ssh_sorted="$(printf "%b" "${ssh_all_times}" | sed '/^$/d' | sort -n)"
              ssh_overall_p95_ms="$(echo "${ssh_sorted}" | awk 'NF{a[++n]=$1} END{if(n==0){print 0}else{idx=int((n*95+99)/100); if(idx<1)idx=1; if(idx>n)idx=n; print a[idx]}}')"
              ssh_overall_max_ms="$(echo "${ssh_sorted}" | awk 'NF{m=$1} END{if(NR==0){print 0}else{print m}}')"

              batch_sorted="$(printf "%b" "${ssh_batch_times}" | sed '/^$/d' | sort -n)"
              ssh_batch_p50_ms="$(echo "${batch_sorted}" | awk 'NF{a[++n]=$1} END{if(n==0){print 0}else{print a[int((n+1)/2)]}}')"
            fi
          fi

          if [[ -z "${ssh_cmd_details}" ]]; then
            ssh_cmd_details='| _(ssh probe skipped: loopback SSH unavailable on runner)_ | 0 | 0 | 0 ms | 0 ms | 0 ms | ℹ️ |\n'
          fi
          printf "%b" "${ssh_cmd_details}" > /tmp/metrics_perf_ssh_details.md

          echo "build_ms=${build_ms}" >> "$GITHUB_OUTPUT"
          echo "binary_size_mb=${binary_size_mb}" >> "$GITHUB_OUTPUT"
          echo "cmd_limit_ms=${cmd_limit_ms}" >> "$GITHUB_OUTPUT"
          echo "cmd_runs=${cmd_runs}" >> "$GITHUB_OUTPUT"
          echo "cmd_failures=${cmd_failures}" >> "$GITHUB_OUTPUT"
          echo "overall_p50_ms=${overall_p50_ms}" >> "$GITHUB_OUTPUT"
          echo "overall_p95_ms=${overall_p95_ms}" >> "$GITHUB_OUTPUT"
          echo "overall_max_ms=${overall_max_ms}" >> "$GITHUB_OUTPUT"
          echo "remote_suite_ok=${remote_suite_ok}" >> "$GITHUB_OUTPUT"
          echo "remote_suite_ms=${remote_suite_ms}" >> "$GITHUB_OUTPUT"
          echo "gateway_suite_ok=${gateway_suite_ok}" >> "$GITHUB_OUTPUT"
          echo "gateway_suite_ms=${gateway_suite_ms}" >> "$GITHUB_OUTPUT"
          echo "ssh_ready=${ssh_ready}" >> "$GITHUB_OUTPUT"
          echo "ssh_cmd_limit_ms=${ssh_cmd_limit_ms}" >> "$GITHUB_OUTPUT"
          echo "ssh_cmd_runs=${ssh_cmd_runs}" >> "$GITHUB_OUTPUT"
          echo "ssh_cmd_failures=${ssh_cmd_failures}" >> "$GITHUB_OUTPUT"
          echo "ssh_overall_p95_ms=${ssh_overall_p95_ms}" >> "$GITHUB_OUTPUT"
          echo "ssh_overall_max_ms=${ssh_overall_max_ms}" >> "$GITHUB_OUTPUT"
          echo "ssh_batch_p50_ms=${ssh_batch_p50_ms}" >> "$GITHUB_OUTPUT"

      - name: Build metrics report
        id: report
        shell: bash
        run: |
          set -euo pipefail

          hard_fail=0
          if [[ "${{ steps.bundle.outputs.hard_fail }}" == '1' ]]; then
            hard_fail=1
          fi
          if [[ "${{ steps.readability.outputs.fail }}" == '1' ]]; then
            hard_fail=1
          fi

          METRICS_HEAD_REF="${{ github.head_ref }}" \
          METRICS_BUNDLE_HARD_FAIL="${{ steps.bundle.outputs.hard_fail }}" \
          METRICS_BUNDLE_RAW_KB="${{ steps.bundle.outputs.raw_kb }}" \
          METRICS_BUNDLE_GZIP_KB="${{ steps.bundle.outputs.gzip_kb }}" \
          METRICS_BUNDLE_INITIAL_GZIP_KB="${{ steps.bundle.outputs.initial_gzip_kb }}" \
          METRICS_BUNDLE_GZIP_LIMIT_KB="${{ steps.bundle.outputs.gzip_limit_kb }}" \
          METRICS_BUNDLE_INITIAL_LIMIT_KB="${{ steps.bundle.outputs.initial_limit_kb }}" \
          METRICS_COMMIT_TOTAL="${{ steps.commit_size.outputs.total }}" \
          METRICS_COMMIT_PASSED="${{ steps.commit_size.outputs.passed }}" \
          METRICS_COMMIT_MAX_LINES="${{ steps.commit_size.outputs.max_lines }}" \
          METRICS_COMMIT_MAX_SEEN="${{ steps.commit_size.outputs.max_seen }}" \
          METRICS_COMMIT_DETAILS_PATH="/tmp/metrics_commit_details.md" \
          METRICS_COMMIT_FAIL="${{ steps.commit_size.outputs.fail }}" \
          METRICS_PERF_BUILD_MS="${{ steps.perf.outputs.build_ms }}" \
          METRICS_PERF_BINARY_SIZE_MB="${{ steps.perf.outputs.binary_size_mb }}" \
          METRICS_PERF_CMD_RUNS="${{ steps.perf.outputs.cmd_runs }}" \
          METRICS_PERF_CMD_FAILURES="${{ steps.perf.outputs.cmd_failures }}" \
          METRICS_PERF_OVERALL_P95_MS="${{ steps.perf.outputs.overall_p95_ms }}" \
          METRICS_PERF_CMD_LIMIT_MS="${{ steps.perf.outputs.cmd_limit_ms }}" \
          METRICS_PERF_REMOTE_SUITE_OK="${{ steps.perf.outputs.remote_suite_ok }}" \
          METRICS_PERF_REMOTE_SUITE_MS="${{ steps.perf.outputs.remote_suite_ms }}" \
          METRICS_PERF_GATEWAY_SUITE_OK="${{ steps.perf.outputs.gateway_suite_ok }}" \
          METRICS_PERF_GATEWAY_SUITE_MS="${{ steps.perf.outputs.gateway_suite_ms }}" \
          METRICS_PERF_SSH_READY="${{ steps.perf.outputs.ssh_ready }}" \
          METRICS_PERF_SSH_CMD_RUNS="${{ steps.perf.outputs.ssh_cmd_runs }}" \
          METRICS_PERF_SSH_CMD_FAILURES="${{ steps.perf.outputs.ssh_cmd_failures }}" \
          METRICS_PERF_SSH_OVERALL_P95_MS="${{ steps.perf.outputs.ssh_overall_p95_ms }}" \
          METRICS_PERF_SSH_CMD_LIMIT_MS="${{ steps.perf.outputs.ssh_cmd_limit_ms }}" \
          METRICS_PERF_SSH_BATCH_P50_MS="${{ steps.perf.outputs.ssh_batch_p50_ms }}" \
          METRICS_PERF_CMD_DETAILS_PATH="/tmp/metrics_perf_cmd_details.md" \
          METRICS_PERF_SSH_DETAILS_PATH="/tmp/metrics_perf_ssh_details.md" \
          METRICS_READABILITY_CHECKED="${{ steps.readability.outputs.checked }}" \
          METRICS_READABILITY_PASSED="${{ steps.readability.outputs.passed }}" \
          METRICS_READABILITY_VIOLATIONS="${{ steps.readability.outputs.violations }}" \
          METRICS_READABILITY_LEGACY_OVERSIZED="${{ steps.readability.outputs.legacy_oversized }}" \
          METRICS_READABILITY_MAX_LINES="${{ steps.readability.outputs.max_lines }}" \
          METRICS_READABILITY_DETAILS_PATH="/tmp/metrics_readability_details.md" \
          METRICS_READABILITY_FAIL="${{ steps.readability.outputs.fail }}" \
            node scripts/ci/metrics-harness-comment.cjs > /tmp/pr-metrics-comment.md
          echo "hard_fail=${hard_fail}" >> "$GITHUB_OUTPUT"

      - name: Upsert PR metrics comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          marker='<!-- carrier-pr-metrics-harness -->'
          pr='${{ github.event.pull_request.number }}'
          body="$(cat /tmp/pr-metrics-comment.md)"

          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            | jq -r --arg m "$marker" '[.[] | select(.body | contains($m)) | .id] | .[]')

          existing_id="$(echo "$ids" | head -n1)"

          if [[ -n "${existing_id:-}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body" >/dev/null
            echo "$ids" | tail -n +2 | while read -r extra_id; do
              [[ -n "$extra_id" ]] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${extra_id}" >/dev/null || true
            done
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi

      - name: Upload metrics report artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: carrier-pr-metrics-comment
          path: /tmp/pr-metrics-comment.md
          if-no-files-found: error
          retention-days: 7

      - name: Fail on hard gate violations
        if: steps.report.outputs.hard_fail == '1'
        shell: bash
        run: |
          echo "::error::PR metrics harness hard gate failed. See the PR comment for details."
          exit 1
