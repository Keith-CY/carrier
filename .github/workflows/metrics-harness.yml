name: PR Metrics Harness

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: metrics-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics-harness:
    name: Metrics Harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.1.8

      - name: Commit size metrics (soft gate)
        id: commit_size
        shell: bash
        run: |
          set -euo pipefail

          max_lines=500
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          fail=0
          fail_count=0
          max_seen=0
          total=0
          details=""

          mapfile -t commits < <(git rev-list --no-merges "${base_sha}..${head_sha}")
          total=${#commits[@]}

          for commit in "${commits[@]}"; do
            subject="$(git log --format=%s -1 "${commit}")"
            short="$(git rev-parse --short "${commit}")"
            stat="$(git diff --shortstat "${commit}^..${commit}" 2>/dev/null || true)"

            adds="$(echo "${stat}" | sed -n 's/.* \([0-9][0-9]*\) insertion.*/\1/p')"
            dels="$(echo "${stat}" | sed -n 's/.* \([0-9][0-9]*\) deletion.*/\1/p')"
            adds="${adds:-0}"
            dels="${dels:-0}"
            total_lines=$((adds + dels))

            if [[ "${total_lines}" -gt "${max_seen}" ]]; then
              max_seen="${total_lines}"
            fi

            if [[ "${total_lines}" -gt "${max_lines}" ]]; then
              details+="| \`${short}\` | ${total_lines} | ≤ ${max_lines} | ❌ | ${subject} |\n"
              fail=1
              fail_count=$((fail_count + 1))
            else
              details+="| \`${short}\` | ${total_lines} | ≤ ${max_lines} | ✅ | ${subject} |\n"
            fi
          done

          passed=$((total - fail_count))
          if [[ "${total}" -eq 0 ]]; then
            details='| _(no commits)_ | 0 | ≤ 500 | ✅ | n/a |\n'
          fi

          echo "fail=${fail}" >> "$GITHUB_OUTPUT"
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"
          echo "max_seen=${max_seen}" >> "$GITHUB_OUTPUT"
          echo "max_lines=${max_lines}" >> "$GITHUB_OUTPUT"
          printf "%b" "${details}" > /tmp/metrics_commit_details.md

      - name: Build WebUI + bundle size metrics (hard gate)
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/build-webui.sh

          assets_dir="webui/static/assets"
          index_html="webui/static/index.html"
          gzip_limit_kb=350
          initial_limit_kb=180

          if [[ ! -d "${assets_dir}" ]]; then
            echo "::error::missing ${assets_dir}" >&2
            exit 1
          fi
          if [[ ! -f "${index_html}" ]]; then
            echo "::error::missing ${index_html}" >&2
            exit 1
          fi

          raw_bytes=0
          gzip_bytes=0
          while IFS= read -r -d '' js_file; do
            file_raw=$(wc -c < "${js_file}")
            file_gzip=$(gzip -c "${js_file}" | wc -c)
            raw_bytes=$((raw_bytes + file_raw))
            gzip_bytes=$((gzip_bytes + file_gzip))
          done < <(find "${assets_dir}" -maxdepth 1 -type f -name '*.js' -print0)

          initial_gzip_bytes=0
          while IFS= read -r src; do
            src_path="${src#/}"
            full_path="webui/static/${src_path}"
            if [[ -f "${full_path}" ]]; then
              initial_gzip_bytes=$((initial_gzip_bytes + $(gzip -c "${full_path}" | wc -c)))
            fi
          done < <(grep -oE 'src="/assets/[^"]+\.js"' "${index_html}" | sed 's/src="\(.*\)"/\1/')

          raw_kb=$((raw_bytes / 1024))
          gzip_kb=$((gzip_bytes / 1024))
          initial_gzip_kb=$((initial_gzip_bytes / 1024))

          hard_fail=0
          if [[ "${gzip_kb}" -gt "${gzip_limit_kb}" ]]; then
            hard_fail=1
          fi
          if [[ "${initial_gzip_kb}" -gt "${initial_limit_kb}" ]]; then
            hard_fail=1
          fi

          echo "raw_kb=${raw_kb}" >> "$GITHUB_OUTPUT"
          echo "gzip_kb=${gzip_kb}" >> "$GITHUB_OUTPUT"
          echo "initial_gzip_kb=${initial_gzip_kb}" >> "$GITHUB_OUTPUT"
          echo "gzip_limit_kb=${gzip_limit_kb}" >> "$GITHUB_OUTPUT"
          echo "initial_limit_kb=${initial_limit_kb}" >> "$GITHUB_OUTPUT"
          echo "hard_fail=${hard_fail}" >> "$GITHUB_OUTPUT"

      - name: Code readability metrics (informational)
        id: readability
        shell: bash
        run: |
          set -euo pipefail

          details=""
          over_target=0
          files_over_500=0

          while read -r lines file; do
            [[ -z "${lines}" || -z "${file}" ]] && continue
            if [[ "${lines}" -le 300 ]]; then
              continue
            fi

            target=$(( ((lines * 60 / 100) + 50) / 100 * 100 ))
            if [[ "${target}" -lt 500 ]]; then
              target=500
            fi

            status='✅'
            if [[ "${lines}" -gt "${target}" ]]; then
              status='⚠️'
              over_target=$((over_target + 1))
            fi

            if [[ "${lines}" -gt 500 ]]; then
              files_over_500=$((files_over_500 + 1))
            fi

            details+="| \`${file}\` | ${lines} | ≤ ${target} | ${status} |\n"
          done < <(
            find baseagent cmd codeagent daemon gateway shared webui/src scripts \
              -type f \( -name '*.go' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.cjs' -o -name '*.mjs' -o -name '*.sh' \) \
              -exec wc -l {} + 2>/dev/null \
              | grep -v ' total$' \
              | sort -rn \
              | awk '{print $1 " " $2}' \
              | head -n 120
          )

          if [[ -z "${details}" ]]; then
            details='| _(no files above 300 lines)_ | 0 | ≤ 500 | ✅ |\n'
          fi

          printf "%b" "${details}" > /tmp/metrics_readability_details.md
          echo "over_target=${over_target}" >> "$GITHUB_OUTPUT"
          echo "files_over_500=${files_over_500}" >> "$GITHUB_OUTPUT"

      - name: Build metrics report
        id: report
        shell: bash
        run: |
          set -euo pipefail

          hard_fail=0
          overall='✅ All hard gates passed'

          if [[ "${{ steps.bundle.outputs.hard_fail }}" == '1' ]]; then
            hard_fail=1
            overall='❌ Hard gates failed'
          fi

          bundle_icon='✅'
          if [[ "${{ steps.bundle.outputs.hard_fail }}" == '1' ]]; then
            bundle_icon='❌'
          fi

          commit_icon='✅'
          if [[ "${{ steps.commit_size.outputs.fail }}" == '1' ]]; then
            commit_icon='❌'
          fi

          commit_details="$(cat /tmp/metrics_commit_details.md)"
          readability_details="$(cat /tmp/metrics_readability_details.md)"

          cat > /tmp/pr-metrics-comment.md <<EOF
          <!-- carrier-pr-metrics-harness -->
          ## 📏 Carrier Metrics Harness Report

          **Status**: ${overall}

          ### Commit Size (soft gate) ${commit_icon}

          | Metric | Value | Limit | Status |
          |--------|-------|-------|--------|
          | Commits checked | ${{ steps.commit_size.outputs.total }} | — | — |
          | All within limit | ${{ steps.commit_size.outputs.passed }}/${{ steps.commit_size.outputs.total }} | ≤ ${{ steps.commit_size.outputs.max_lines }} lines | ${commit_icon} |
          | Largest commit | ${{ steps.commit_size.outputs.max_seen }} lines | ≤ ${{ steps.commit_size.outputs.max_lines }} | $( [[ "${{ steps.commit_size.outputs.max_seen }}" -le "${{ steps.commit_size.outputs.max_lines }}" ]] && echo "✅" || echo "❌" ) |

          <details><summary>Per-commit breakdown</summary>

          | Commit | Lines changed | Limit | Status | Subject |
          |--------|---------------|-------|--------|---------|
          ${commit_details}

          </details>

          ### WebUI Bundle Size (hard gate) ${bundle_icon}

          | Metric | Value | Limit | Status |
          |--------|-------|-------|--------|
          | JS bundle (raw) | ${{ steps.bundle.outputs.raw_kb }} KB | — | — |
          | JS bundle (gzip) | ${{ steps.bundle.outputs.gzip_kb }} KB | ≤ ${{ steps.bundle.outputs.gzip_limit_kb }} KB | $( [[ "${{ steps.bundle.outputs.gzip_kb }}" -le "${{ steps.bundle.outputs.gzip_limit_kb }}" ]] && echo "✅" || echo "❌" ) |
          | JS initial load (gzip) | ${{ steps.bundle.outputs.initial_gzip_kb }} KB | ≤ ${{ steps.bundle.outputs.initial_limit_kb }} KB | $( [[ "${{ steps.bundle.outputs.initial_gzip_kb }}" -le "${{ steps.bundle.outputs.initial_limit_kb }}" ]] && echo "✅" || echo "❌" ) |

          ### Code Readability (informational)

          | File | Lines | Target | Status |
          |------|-------|--------|--------|
          ${readability_details}
          | **Files > 500 lines** | **${{ steps.readability.outputs.files_over_500 }}** | trend ↓ | $( [[ "${{ steps.readability.outputs.files_over_500 }}" -le 40 ]] && echo "✅" || echo "⚠️" ) |
          | Files over target | ${{ steps.readability.outputs.over_target }} | 0 | $( [[ "${{ steps.readability.outputs.over_target }}" -eq 0 ]] && echo "✅" || echo "⚠️" ) |

          ---
          > 📊 Metrics spec: [\`docs/architecture/metrics.md\`](../blob/${{ github.head_ref }}/docs/architecture/metrics.md)
          EOF

          sed -i 's/^          //' /tmp/pr-metrics-comment.md
          echo "hard_fail=${hard_fail}" >> "$GITHUB_OUTPUT"

      - name: Upsert PR metrics comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          marker='<!-- carrier-pr-metrics-harness -->'
          pr='${{ github.event.pull_request.number }}'
          body="$(cat /tmp/pr-metrics-comment.md)"

          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            | jq -r --arg m "$marker" '[.[] | select(.body | contains($m)) | .id] | .[]')

          existing_id="$(echo "$ids" | head -n1)"

          if [[ -n "${existing_id:-}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body" >/dev/null
            echo "$ids" | tail -n +2 | while read -r extra_id; do
              [[ -n "$extra_id" ]] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${extra_id}" >/dev/null || true
            done
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi

      - name: Upload metrics report artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: carrier-pr-metrics-comment
          path: /tmp/pr-metrics-comment.md
          if-no-files-found: error
          retention-days: 7

      - name: Fail on hard gate violations
        if: steps.report.outputs.hard_fail == '1'
        shell: bash
        run: |
          echo "::error::PR metrics harness hard gate failed. See the PR comment for details."
          exit 1
