name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-deploy:
    name: End-to-End Tests (Deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.1.8"

      - name: Install gateway dependencies
        working-directory: gateway
        run: bun install --frozen-lockfile --no-progress

      - name: Run end-to-end tests
        run: ./scripts/run-e2e-tests.sh

  build-packages:
    needs: e2e-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            label: linux-x64
            ext: ""
            archive_ext: zip
          - goos: linux
            goarch: arm64
            label: linux-arm64
            ext: ""
            archive_ext: zip
          - goos: darwin
            goarch: amd64
            label: darwin-x64
            ext: ""
            archive_ext: zip
          - goos: darwin
            goarch: arm64
            label: darwin-arm64
            ext: ""
            archive_ext: zip
          - goos: windows
            goarch: amd64
            label: windows-x64
            ext: ".exe"
            archive_ext: zip
          - goos: windows
            goarch: arm64
            label: windows-arm64
            ext: ".exe"
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: daemon/go.mod

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          archive_name="carrier-${GITHUB_SHA}-${{ matrix.label }}"
          binary_name="agentd${{ matrix.ext }}"
          release_dir="dist/${archive_name}"
          package_file="${archive_name}.${{ matrix.archive_ext }}"

          mkdir -p "${release_dir}"

          (cd daemon && \
            CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
              go build -trimpath -ldflags="-s -w" -o "../${release_dir}/${binary_name}" ./cmd/agentd)

          cp -R daemon catalog gateway docs README.md "${release_dir}/"

          (cd dist && zip -r "${package_file}" "${archive_name}")
          (cd dist && sha256sum "${package_file}" > "${package_file}.sha256")

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carrier-${{ matrix.label }}
          path: |
            dist/carrier-${{ github.sha }}-${{ matrix.label }}.${{ matrix.archive_ext }}
            dist/carrier-${{ github.sha }}-${{ matrix.label }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  sign-artifacts:
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # Required for cosign keyless OIDC signing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign release artifacts
        run: ./scripts/sign-artifacts.sh dist
        env:
          SIGNING_METHOD: cosign

      - name: Verify signatures (spot-check)
        run: |
          set -euo pipefail
          # Find the first .zip file and verify its signature
          first_zip=$(find dist -name '*.zip' -type f | head -n 1)
          if [[ -z "$first_zip" ]]; then
            echo "ERROR: No zip artifacts found to verify"
            exit 1
          fi
          echo "Spot-checking signature for: $first_zip"
          ./scripts/verify-signature.sh "$first_zip"

      - name: Upload signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carrier-signatures
          path: dist/**/*.sig
          if-no-files-found: error

  release:
    needs: [build-packages, sign-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Required for creating GitHub releases
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: main-${{ github.sha }}
          name: "main-${{ github.sha }}"
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.sha256
            dist/**/*.sig
